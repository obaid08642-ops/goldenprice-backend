name: Refresh local gold bar prices
on:
  schedule: [{ cron: "17 5 * * *" }]
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  retail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: cd web && node scripts/update-retail.mjs && node scripts/check-retail.mjs $(ls src/data/retail | grep -v '^_' | sed 's/.json//')
      - run: |
          git config user.name "retail-bot"; git config user.email "bot@users.noreply.github.com"
          git add web/src/data/retail web/src/data/retail-history && (git diff --cached --quiet || (git commit -m "Refresh local bar prices" && git push))
